# Railway configuration for TypeDB Studio
# Using Dockerfile for build to properly handle git submodules

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[deploy.healthcheck]
  path = "/"
  timeout = 100
  interval = 20
