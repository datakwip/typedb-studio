# Railway configuration for TypeDB Studio
# Note: Build configuration is in nixpacks.toml

[build]
  builder = "NIXPACKS"

[deploy]
  startCommand = "npx serve -s dist/typedb-studio/browser -l $PORT"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[deploy.healthcheck]
  path = "/"
  timeout = 100
  interval = 20
